name: container-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint all shell scripts
        run: shellcheck -x -S warning scripts/setup.sh scripts/lib/common.sh scripts/modules/*.sh test/*.sh

  fresh-install:
    name: fresh Ubuntu 26.04 install (unattended, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run installer end-to-end in a fresh container
        # Default module set (git claude-code docker jdk maven cpp golang
        # rust) under DEV_SETUP_ASSUME_YES=1, then a second pass to verify
        # idempotency, then per-module version probes. elastic and ollama
        # are excluded: the former needs a Docker daemon inside the test
        # container, the latter is a GB-scale download that needs a GPU to
        # be meaningful.
        run: ./test/container-test.sh --rerun
