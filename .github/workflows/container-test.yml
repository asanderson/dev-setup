name: container-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # ubuntu-latest runners ship shellcheck preinstalled; the apt path is
        # only a fallback (it has hung on runner mirror flakiness).
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
      - name: Lint all shell scripts
        run: shellcheck -x -S warning scripts/setup.sh scripts/offline-bundle.sh scripts/lib/*.sh scripts/modules/*.sh test/*.sh

  uninstall:
    name: install + uninstall round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install a scoped set, then uninstall it and verify removal
        # git+python+maven+jdk+golang install unattended, probe green, then
        # uninstall.sh --modules removes them; asserts each tool is gone
        # and python3 (an OS dependency) survives.
        run: ./test/container-test.sh --uninstall git python maven jdk golang

  offline-bundle:
    name: offline bundle (pack, then air-gapped install)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pack a scoped bundle (git, python, maven, jdk)
        # Full packs include GB-scale images/toolchains; a scoped pack
        # exercises every mechanism (fresh-container apt closure, pinned
        # artifact fetch, manifest, archive) at CI-friendly size.
        run: ./scripts/offline-bundle.sh --pack --modules git,python,maven,jdk --out /tmp
      - name: Install it in a fresh container with NO network
        # --network none is a real air-gap: the self-contained installer
        # must verify the manifest and install everything from the bundle.
        run: |
          tar -C /tmp -xzf /tmp/dev-setup-offline-*.tar.gz
          bundle="$(ls -d /tmp/dev-setup-offline-*/ | head -1)"
          docker run --rm --network none -v "${bundle}:/bundle:ro" ubuntu:26.04 \
            bash -c "/bundle/install-offline.sh && git --version && git lfs version && python3 --version && pip3 --version && pipx --version && /opt/maven/bin/mvn -version | head -1"

  fresh-install:
    name: fresh Ubuntu 26.04 install (unattended, twice)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run installer end-to-end in a fresh container
        # First asserts the target-OS contract (--os bogus exits 2; an
        # unsupported component (proton-vpn) on --os rocky warns and is skipped
        # unattended; the target/machine mismatch guard fires before
        # anything installs). Then the default module set (git claude-code
        # claude-plugins vscode docker podman
        # jdk maven cpp golang rust python cloud + six proton-* modules;
        # proton-vpn is excluded because its daemon's postinst needs
        # systemd, absent in containers), scoped via
        # setup.sh --modules (which doubles as the CI test
        # of the component-selection flags) under DEV_SETUP_ASSUME_YES=1,
        # then a second pass to verify idempotency, then per-module version
        # probes. elastic and opensearch are excluded (they need a Docker
        # daemon inside the test container); ollama too (GB-scale download
        # that needs a GPU to be meaningful).
        run: ./test/container-test.sh --rerun

  gpu-path:
    name: GPU-present branches (stubbed RTX 5090)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run GPU-path test in a fresh container
        # An nvidia-smi stub simulates the MSI Raider 18's RTX 5090 so the
        # branches the GPU-less fresh-install job can never reach get
        # exercised: the docker module's NVIDIA Container Toolkit
        # repo+package install and nvidia-ctk daemon.json configuration,
        # dockerd registering the nvidia runtime (container runs
        # --privileged for this), and the ollama module's GPU path.
        # Validates branching and toolkit machinery — not CUDA execution,
        # which still needs real hardware.
        run: ./test/container-test.sh --gpu-path
