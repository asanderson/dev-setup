name: fix-modes

# TEMPORARY - restores the executable bits that Contents-API pushes
# stripped from three scripts (a real git push preserves modes; the API
# cannot set them). Runs only on this working branch and no-ops when
# modes are already correct. Deleted from the branch once the fix lands.

on:
  push:
    branches: [claude/deep-research-s0d1oz]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore 100755 on the affected scripts and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x scripts/build.sh test/engines-init.sh test/engines-test.sh
          if git diff --cached --quiet; then
            echo "modes already correct - nothing to do"
            exit 0
          fi
          git commit -m "Restore executable bits stripped by API-pushed commits"
          git push
